  <linearGradient id="wroad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8dcc9"/><stop offset="1" stop-color="#d6c7ae"/>
  </linearGradient>
  <linearGradient id="wpv" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e40af"/>
  </linearGradient>
</defs>

