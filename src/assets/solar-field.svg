<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2400" viewBox="0 0 1600 2400" preserveAspectRatio="xMidYMin slice">
<defs>
  <linearGradient id="sf-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a9c8f5"/>
    <stop offset="0.6" stop-color="#d5e7fb"/>
    <stop offset="1" stop-color="#f2f8ff"/>
  </linearGradient>
  <radialGradient id="sf-sun" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#fde68a" stop-opacity="0.95"/>
    <stop offset="0.45" stop-color="#fde68a" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sf-hill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b9d8c6"/>
    <stop offset="1" stop-color="#9cc7ae"/>
  </linearGradient>
  <linearGradient id="sf-ground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7ec494"/>
    <stop offset="1" stop-color="#4e9e6c"/>
  </linearGradient>
  <linearGradient id="sf-cell" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2b4d94"/>
    <stop offset="1" stop-color="#16306b"/>
  </linearGradient>
  <linearGradient id="sf-cell2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3a5fa8"/>
    <stop offset="1" stop-color="#1d3a78"/>
  </linearGradient>
  <linearGradient id="sf-mist" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.4"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- sky -->
<rect width="1600" height="800" fill="url(#sf-sky)"/>
<!-- sun -->
<circle cx="1230" cy="210" r="200" fill="url(#sf-sun)"/>
<circle cx="1230" cy="210" r="72" fill="#fde68a"/>
<!-- clouds -->
<g fill="#ffffff" opacity="0.75">
  <ellipse cx="320" cy="170" rx="150" ry="34"/>
  <ellipse cx="430" cy="150" rx="110" ry="28"/>
  <ellipse cx="760" cy="300" rx="180" ry="30" opacity="0.6"/>
  <ellipse cx="880" cy="280" rx="120" ry="24" opacity="0.6"/>
</g>
<!-- distant hills -->
<path d="M0 700 Q 260 620 520 680 T 1080 660 T 1600 700 L1600 800 L0 800 Z" fill="url(#sf-hill)" opacity="0.8"/>
<path d="M0 730 Q 400 680 800 720 T 1600 720 L1600 800 L0 800 Z" fill="#8fbc9f" opacity="0.7"/>
<!-- field -->
<rect y="760" width="1600" height="1640" fill="url(#sf-ground)"/>
<!-- haze band at horizon -->
<rect y="640" width="1600" height="220" fill="url(#sf-mist)"/>

<!-- solar panel rows, perspective from horizon -->
<!-- row 1 (farthest) -->
<g>
  <polygon points="340,806 1260,806 1290,846 310,846" fill="url(#sf-cell)"/>
  <polygon points="340,806 1260,806 1256,800 344,800" fill="#93b4e8" opacity="0.8"/>
  <g stroke="#9db8e4" stroke-width="1.5" opacity="0.6">
    <line x1="470" y1="806" x2="462" y2="846"/><line x1="600" y1="806" x2="596" y2="846"/>
    <line x1="730" y1="806" x2="730" y2="846"/><line x1="870" y1="806" x2="874" y2="846"/>
    <line x1="1000" y1="806" x2="1006" y2="846"/><line x1="1130" y1="806" x2="1140" y2="846"/>
    <line x1="310" y1="826" x2="1290" y2="826"/>
  </g>
</g>
<!-- row 2 -->
<g>
  <polygon points="240,920 1360,920 1410,990 190,990" fill="url(#sf-cell2)"/>
  <polygon points="240,920 1360,920 1354,912 246,912" fill="#a6c2ee" opacity="0.8"/>
  <g stroke="#a9c0e8" stroke-width="2" opacity="0.6">
    <line x1="420" y1="920" x2="405" y2="990"/><line x1="590" y1="920" x2="582" y2="990"/>
    <line x1="760" y1="920" x2="758" y2="990"/><line x1="930" y1="920" x2="938" y2="990"/>
    <line x1="1100" y1="920" x2="1112" y2="990"/><line x1="1250" y1="920" x2="1270" y2="990"/>
    <line x1="190" y1="955" x2="1410" y2="955"/>
  </g>
</g>
<!-- row 3 -->
<g>
  <polygon points="100,1090 1500,1090 1580,1210 20,1210" fill="url(#sf-cell)"/>
  <polygon points="100,1090 1500,1090 1492,1080 108,1080" fill="#a6c2ee" opacity="0.8"/>
  <g stroke="#9db8e4" stroke-width="2.5" opacity="0.6">
    <line x1="330" y1="1090" x2="305" y2="1210"/><line x1="560" y1="1090" x2="545" y2="1210"/>
    <line x1="790" y1="1090" x2="785" y2="1210"/><line x1="1020" y1="1090" x2="1032" y2="1210"/>
    <line x1="1250" y1="1090" x2="1275" y2="1210"/><line x1="1430" y1="1090" x2="1465" y2="1210"/>
    <line x1="40" y1="1150" x2="1560" y2="1150"/>
  </g>
</g>
<!-- row 4 -->
<g>
  <polygon points="-60,1350 1660,1350 1780,1550 -180,1550" fill="url(#sf-cell2)"/>
  <polygon points="-60,1350 1660,1350 1650,1336 -50,1336" fill="#b3cdf2" opacity="0.8"/>
  <g stroke="#a9c0e8" stroke-width="3" opacity="0.6">
    <line x1="230" y1="1350" x2="190" y2="1550"/><line x1="520" y1="1350" x2="495" y2="1550"/>
    <line x1="810" y1="1350" x2="800" y2="1550"/><line x1="1100" y1="1350" x2="1115" y2="1550"/>
    <line x1="1390" y1="1350" x2="1425" y2="1550"/>
    <line x1="-140" y1="1450" x2="1740" y2="1450"/>
  </g>
</g>
<!-- row 5 -->
<g>
  <polygon points="-260,1720 1860,1720 2030,2050 -430,2050" fill="url(#sf-cell)"/>
  <polygon points="-260,1720 1860,1720 1848,1700 -248,1700" fill="#b3cdf2" opacity="0.8"/>
  <g stroke="#9db8e4" stroke-width="4" opacity="0.6">
    <line x1="160" y1="1720" x2="90" y2="2050"/><line x1="560" y1="1720" x2="520" y2="2050"/>
    <line x1="960" y1="1720" x2="945" y2="2050"/><line x1="1360" y1="1720" x2="1380" y2="2050"/>
    <line x1="1700" y1="1720" x2="1760" y2="2050"/>
    <line x1="-390" y1="1880" x2="1990" y2="1880"/>
  </g>
</g>
<!-- row 6 (nearest, cropped at bottom) -->
<g>
  <polygon points="-540,2220 2140,2220 2380,2620 -780,2620" fill="url(#sf-cell2)"/>
  <polygon points="-540,2220 2140,2220 2125,2195 -525,2195" fill="#c4d7f5" opacity="0.85"/>
  <g stroke="#a9c0e8" stroke-width="5" opacity="0.6">
    <line x1="40" y1="2220" x2="-80" y2="2620"/><line x1="560" y1="2220" x2="500" y2="2620"/>
    <line x1="1080" y1="2220" x2="1070" y2="2620"/><line x1="1600" y1="2220" x2="1640" y2="2620"/>
    <line x1="2040" y1="2220" x2="2130" y2="2620"/>
    <line x1="-720" y1="2420" x2="2320" y2="2420"/>
  </g>
</g>
<!-- soft shadows under nearer rows -->
<polygon points="-60,1550 1780,1550 1780,1590 -60,1590" fill="#1c4d33" opacity="0.18"/>
<polygon points="-260,2050 2030,2050 2030,2110 -260,2110" fill="#1c4d33" opacity="0.18"/>
</svg>
