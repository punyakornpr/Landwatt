<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2400" viewBox="0 0 1600 2400" preserveAspectRatio="xMidYMin slice">
<style>
  .blade { animation: spin 6.5s linear infinite; }
  .blade.slow { animation-duration: 8.5s; }
  .blade.slower { animation-duration: 10.5s; animation-delay: -3s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#aad4f0"/>
    <stop offset="0.6" stop-color="#d6ecfa"/>
    <stop offset="1" stop-color="#eef8fd"/>
  </linearGradient>
  <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#fce9a8" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#fce9a8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c4e4c6"/>
    <stop offset="1" stop-color="#a9d8ae"/>
  </linearGradient>
  <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#aedeae"/>
    <stop offset="1" stop-color="#8fce97"/>
  </linearGradient>
  <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9ed6a4"/>
    <stop offset="1" stop-color="#7cc489"/>
  </linearGradient>
  <linearGradient id="pcell" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3b5fa8"/>
    <stop offset="1" stop-color="#1a3572"/>
  </linearGradient>

  <!-- panel table: small (far) -->
  <g id="pvA">
    <polygon points="10,0 180,0 170,78 0,78" fill="url(#pcell)" stroke="#12285e" stroke-width="2"/>
    <line x1="10" y1="0" x2="180" y2="0" stroke="#c7dcf7" stroke-width="2"/>
    <line x1="67" y1="0" x2="57" y2="78" stroke="#8ba8dd" stroke-width="1.5" opacity="0.75"/>
    <line x1="123" y1="0" x2="114" y2="78" stroke="#8ba8dd" stroke-width="1.5" opacity="0.75"/>
    <line x1="5" y1="39" x2="175" y2="39" stroke="#8ba8dd" stroke-width="1.5" opacity="0.75"/>
    <line x1="55" y1="78" x2="55" y2="92" stroke="#5b6b85" stroke-width="4"/>
    <line x1="125" y1="78" x2="125" y2="92" stroke="#5b6b85" stroke-width="4"/>
    <ellipse cx="90" cy="97" rx="85" ry="7" fill="#1c4d33" opacity="0.22"/>
  </g>
  <!-- panel table: medium -->
  <g id="pvB">
    <polygon points="13,0 218,0 205,115 0,115" fill="url(#pcell)" stroke="#12285e" stroke-width="2.5"/>
    <line x1="13" y1="0" x2="218" y2="0" stroke="#c7dcf7" stroke-width="2.5"/>
    <line x1="82" y1="0" x2="68" y2="115" stroke="#8ba8dd" stroke-width="2" opacity="0.75"/>
    <line x1="150" y1="0" x2="137" y2="115" stroke="#8ba8dd" stroke-width="2" opacity="0.75"/>
    <line x1="6" y1="57" x2="211" y2="57" stroke="#8ba8dd" stroke-width="2" opacity="0.75"/>
    <line x1="65" y1="115" x2="65" y2="138" stroke="#5b6b85" stroke-width="5"/>
    <line x1="150" y1="115" x2="150" y2="138" stroke="#5b6b85" stroke-width="5"/>
    <ellipse cx="107" cy="143" rx="105" ry="9" fill="#1c4d33" opacity="0.22"/>
  </g>
  <!-- panel table: large (near) -->
  <g id="pvC">
    <polygon points="17,0 262,0 245,155 0,155" fill="url(#pcell)" stroke="#12285e" stroke-width="3"/>
    <line x1="17" y1="0" x2="262" y2="0" stroke="#c7dcf7" stroke-width="3"/>
    <line x1="99" y1="0" x2="82" y2="155" stroke="#8ba8dd" stroke-width="2.5" opacity="0.75"/>
    <line x1="180" y1="0" x2="163" y2="155" stroke="#8ba8dd" stroke-width="2.5" opacity="0.75"/>
    <line x1="8" y1="77" x2="253" y2="77" stroke="#8ba8dd" stroke-width="2.5" opacity="0.75"/>
    <line x1="78" y1="155" x2="78" y2="188" stroke="#5b6b85" stroke-width="6"/>
    <line x1="180" y1="155" x2="180" y2="188" stroke="#5b6b85" stroke-width="6"/>
    <ellipse cx="129" cy="195" rx="130" ry="11" fill="#1c4d33" opacity="0.22"/>
  </g>
</defs>

<!-- sky -->
<rect width="1600" height="1150" fill="url(#sky)"/>
<circle cx="1370" cy="330" r="210" fill="url(#sunglow)"/>
<circle cx="1370" cy="330" r="92" fill="#fbe38a"/>

<!-- clouds -->
<g fill="#ffffff">
  <g opacity="0.95">
    <ellipse cx="240" cy="170" rx="130" ry="42"/>
    <ellipse cx="350" cy="150" rx="105" ry="34"/>
    <ellipse cx="440" cy="175" rx="95" ry="30"/>
    <rect x="150" y="160" width="380" height="55" rx="27"/>
  </g>
  <g opacity="0.9">
    <ellipse cx="880" cy="430" rx="120" ry="36"/>
    <ellipse cx="980" cy="415" rx="90" ry="28"/>
    <rect x="790" y="420" width="270" height="46" rx="23"/>
  </g>
  <g opacity="0.85">
    <ellipse cx="150" cy="640" rx="110" ry="32"/>
    <ellipse cx="250" cy="625" rx="85" ry="26"/>
    <rect x="70" y="630" width="260" height="42" rx="21"/>
  </g>
  <g opacity="0.8">
    <ellipse cx="1330" cy="700" rx="100" ry="28"/>
    <ellipse cx="1420" cy="688" rx="75" ry="22"/>
  </g>
</g>

<!-- hills -->
<path d="M0 980 Q 300 860 640 940 T 1600 900 L1600 1180 L0 1180 Z" fill="url(#hillA)"/>
<path d="M0 1080 Q 400 980 820 1060 T 1600 1040 L1600 1300 L0 1300 Z" fill="url(#hillB)"/>

<!-- wind turbines on the far ridge -->
<g>
  <!-- turbine 1 (left) -->
  <g stroke="#f8fafc" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <path d="M368,900 L392,900 L386,806 L374,806 Z" fill="#f8fafc" stroke="none"/>
    <rect x="380" y="794" width="20" height="11" rx="3" fill="#f8fafc" stroke="none"/>
    <g class="blade" style="transform-origin:380px 800px">
      <line x1="380" y1="800" x2="380" y2="730"/>
      <line x1="380" y1="800" x2="440.6" y2="835"/>
      <line x1="380" y1="800" x2="319.4" y2="835"/>
    </g>
    <circle cx="380" cy="800" r="7" fill="#f8fafc" stroke="none"/>
  </g>
  <!-- turbine 2 (center, main) -->
  <g stroke="#f8fafc" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <path d="M938,945 L962,945 L955,816 L945,816 Z" fill="#f8fafc" stroke="none"/>
    <rect x="950" y="803" width="22" height="12" rx="3" fill="#f8fafc" stroke="none"/>
    <g class="blade slow" style="transform-origin:950px 810px">
      <line x1="950" y1="810" x2="950" y2="728"/>
      <line x1="950" y1="810" x2="1021" y2="851"/>
      <line x1="950" y1="810" x2="879" y2="851"/>
    </g>
    <circle cx="950" cy="810" r="8" fill="#f8fafc" stroke="none"/>
  </g>
  <!-- turbine 3 (right, smaller) -->
  <g stroke="#f8fafc" stroke-width="4" stroke-linecap="round" opacity="0.75">
    <path d="M1471,940 L1489,940 L1484,866 L1476,866 Z" fill="#f8fafc" stroke="none"/>
    <rect x="1480" y="855" width="17" height="10" rx="3" fill="#f8fafc" stroke="none"/>
    <g class="blade slower" style="transform-origin:1480px 862px">
      <line x1="1480" y1="862" x2="1480" y2="804"/>
      <line x1="1480" y1="862" x2="1530" y2="891"/>
      <line x1="1480" y1="862" x2="1430" y2="891"/>
    </g>
    <circle cx="1480" cy="862" r="6" fill="#f8fafc" stroke="none"/>
  </g>
</g>

<!-- meadow -->
<path d="M0 1180 Q 500 1120 900 1180 T 1600 1160 L1600 2400 L0 2400 Z" fill="url(#meadow)"/>

<!-- winding path -->
<path d="M430 1180
         C 400 1300, 460 1400, 380 1520
         C 300 1640, 340 1780, 260 1920
         C 190 2040, 220 2220, 150 2400
         L 430 2400
         C 490 2240, 470 2080, 540 1950
         C 610 1820, 560 1680, 640 1560
         C 720 1440, 660 1320, 690 1230
         C 700 1200, 640 1180, 560 1176
         Z" fill="#f0e6c8" opacity="0.95"/>

<!-- solar farm block on the meadow -->
<g>
  <use href="#pvA" x="720" y="1340"/>
  <use href="#pvA" x="930" y="1340"/>
  <use href="#pvA" x="1140" y="1340"/>
  <use href="#pvA" x="1350" y="1340"/>
  <use href="#pvB" x="660" y="1490"/>
  <use href="#pvB" x="905" y="1490"/>
  <use href="#pvB" x="1150" y="1490"/>
  <use href="#pvB" x="1395" y="1490"/>
  <use href="#pvC" x="600" y="1690"/>
  <use href="#pvC" x="905" y="1690"/>
  <use href="#pvC" x="1210" y="1690"/>
  <use href="#pvC" x="1515" y="1690"/>
</g>

<!-- bushes -->
<g fill="#5fae74">
  <ellipse cx="500" cy="2060" rx="55" ry="40"/>
  <ellipse cx="560" cy="2085" rx="38" ry="28"/>
  <ellipse cx="1180" cy="2180" rx="60" ry="42"/>
</g>
<g fill="#4d9c63" opacity="0.8">
  <ellipse cx="530" cy="2090" rx="28" ry="20"/>
  <ellipse cx="1200" cy="2210" rx="34" ry="24"/>
</g>

<!-- cottage upper-left with people -->
<g transform="translate(60,1290) scale(0.72)">
  <ellipse cx="140" cy="252" rx="170" ry="14" fill="#1c4d33" opacity="0.15"/>
  <rect x="0" y="80" width="210" height="150" fill="#fdf6ea"/>
  <polygon points="-18,82 105,-12 228,82" fill="#8a6d5a"/>
  <polygon points="105,-12 228,82 212,82 105,4" fill="#7a5e4d"/>
  <rect x="20" y="118" width="42" height="48" rx="4" fill="#a8c4e2"/>
  <rect x="148" y="118" width="42" height="48" rx="4" fill="#a8c4e2"/>
  <rect x="86" y="128" width="40" height="102" rx="4" fill="#7a5e4d"/>
  <circle cx="118" cy="180" r="3.5" fill="#fdf6ea"/>
  <rect x="-6" y="228" width="222" height="9" fill="#eae0cc"/>
  <!-- people in front -->
  <g transform="translate(228,118)">
    <!-- adult 1 -->
    <circle cx="0" cy="0" r="14" fill="#e8b58d"/>
    <path d="M-16 16 Q0 8 16 16 L14 72 Q0 78 -14 72 Z" fill="#3b5fa8"/>
    <line x1="-8" y1="72" x2="-8" y2="106" stroke="#3a4660" stroke-width="7" stroke-linecap="round"/>
    <line x1="8" y1="72" x2="8" y2="106" stroke="#3a4660" stroke-width="7" stroke-linecap="round"/>
    <!-- adult 2 -->
    <circle cx="46" cy="4" r="13" fill="#e8b58d"/>
    <path d="M32 20 Q46 12 60 20 L66 78 Q46 86 26 78 Z" fill="#d9854f"/>
    <line x1="38" y1="78" x2="38" y2="108" stroke="#7a5e4d" stroke-width="6" stroke-linecap="round"/>
    <line x1="54" y1="78" x2="54" y2="108" stroke="#7a5e4d" stroke-width="6" stroke-linecap="round"/>
    <!-- child -->
    <circle cx="84" cy="42" r="10" fill="#e8b58d"/>
    <path d="M74 56 Q84 50 94 56 L92 90 Q84 94 76 90 Z" fill="#5fae74"/>
    <line x1="79" y1="90" x2="79" y2="110" stroke="#3a4660" stroke-width="5" stroke-linecap="round"/>
    <line x1="89" y1="90" x2="89" y2="110" stroke="#3a4660" stroke-width="5" stroke-linecap="round"/>
  </g>
</g>

<!-- house bottom-right -->
<g transform="translate(1280,2030)">
  <rect x="0" y="90" width="230" height="170" fill="#f7f1e6"/>
  <polygon points="-20,92 115,-10 250,92" fill="#c98d6b"/>
  <polygon points="115,-10 250,92 232,92 115,8" fill="#b57a5a"/>
  <rect x="24" y="130" width="46" height="52" rx="4" fill="#9db8d8"/>
  <rect x="96" y="130" width="46" height="52" rx="4" fill="#9db8d8"/>
  <rect x="166" y="140" width="44" height="120" rx="4" fill="#a0714f"/>
  <circle cx="200" cy="200" r="4" fill="#f7f1e6"/>
  <rect x="-8" y="258" width="250" height="10" fill="#e8dfcd"/>
</g>
</svg>
