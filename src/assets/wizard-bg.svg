<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="wpaper" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#eef3fa"/>
    <stop offset="1" stop-color="#f7fafc"/>
  </linearGradient>
  <pattern id="wgrid" width="80" height="80" patternUnits="userSpaceOnUse">
    <path d="M80 0 H0 V80" fill="none" stroke="#dbe4f0" stroke-width="1"/>
  </pattern>
  <pattern id="wgridS" width="16" height="16" patternUnits="userSpaceOnUse">
    <path d="M16 0 H0 V16" fill="none" stroke="#e8eef7" stroke-width="0.6"/>
  </pattern>
</defs>

<rect width="1600" height="1600" fill="url(#wpaper)"/>
<rect width="1600" height="1600" fill="url(#wgridS)"/>
<rect width="1600" height="1600" fill="url(#wgrid)"/>

<!-- cadastral parcels -->
<g fill="none" stroke="#9db4d0" stroke-width="2">
  <path d="M120 180 L480 150 L560 320 L540 560 L200 600 L140 400 Z"/>
  <path d="M480 150 L860 190 L880 420 L560 320 Z"/>
  <path d="M560 320 L880 420 L920 700 L620 780 L540 560 Z"/>
  <path d="M200 600 L540 560 L620 780 L560 1020 L240 1060 L180 840 Z"/>
  <path d="M920 700 L880 420 L1240 380 L1300 640 L1180 760 Z"/>
  <path d="M1240 380 L860 190 L980 60 L1300 110 L1400 240 Z"/>
  <path d="M1300 640 L1240 380 L1400 240 L1520 420 L1480 680 Z"/>
  <path d="M620 780 L920 700 L1180 760 L1140 1040 L820 1120 L560 1020 Z"/>
  <path d="M1180 760 L1300 640 L1480 680 L1440 980 L1140 1040 Z"/>
  <path d="M240 1060 L560 1020 L820 1120 L780 1380 L420 1440 L260 1300 Z"/>
  <path d="M820 1120 L1140 1040 L1120 1360 L780 1380 Z"/>
  <path d="M1140 1040 L1440 980 L1500 1260 L1120 1360 Z"/>
  <path d="M60 120 L120 180 L140 400 L60 460 Z"/>
  <path d="M1440 980 L1480 680 L1560 760 L1560 1100 Z"/>
</g>

<!-- parcel fills (very light tints) -->
<g>
  <path d="M560 320 L880 420 L920 700 L620 780 L540 560 Z" fill="#dbeafe" opacity="0.45"/>
  <path d="M200 600 L540 560 L620 780 L560 1020 L240 1060 L180 840 Z" fill="#dcfce7" opacity="0.4"/>
  <path d="M1180 760 L1300 640 L1480 680 L1440 980 L1140 1040 Z" fill="#fef3c7" opacity="0.35"/>
  <path d="M820 1120 L1140 1040 L1120 1360 L780 1380 Z" fill="#dbeafe" opacity="0.3"/>
</g>

<!-- contour lines -->
<g fill="none" stroke="#86a6c8" stroke-width="1.6" opacity="0.8">
  <path d="M0 900 Q300 840 600 900 T1200 880 T1600 860"/>
  <path d="M0 950 Q320 890 640 950 T1260 930 T1600 910"/>
  <path d="M0 1000 Q340 945 680 1000 T1320 980 T1600 960"/>
  <path d="M0 60 Q400 110 800 60 T1600 90"/>
  <path d="M0 20 Q420 70 840 20 T1600 50"/>
  <path d="M100 1600 Q260 1450 480 1480 Q700 1510 900 1440 Q1150 1350 1400 1420 Q1520 1450 1600 1440"/>
  <path d="M160 1600 Q300 1490 500 1520 Q720 1550 920 1480 Q1160 1400 1380 1460 Q1520 1490 1600 1480"/>
</g>

<!-- survey corner marks -->
<g stroke="#64748b" stroke-width="2" fill="none">
  <path d="M120 180 l18 0 M120 180 l0 18 M120 180 l12.7 -12.7"/>
  <path d="M480 150 l-18 0 M480 150 l0 18 M480 150 l-12.7 -12.7"/>
  <path d="M860 190 l18 0 M860 190 l0 -18"/>
  <path d="M920 700 l18 0 M920 700 l0 18"/>
  <path d="M620 780 l-18 0 M620 780 l0 18 M620 780 l-12.7 12.7"/>
  <path d="M1140 1040 l18 0 M1140 1040 l0 18"/>
  <path d="M780 1380 l-18 0 M780 1380 l0 -18"/>
  <path d="M1440 980 l18 0 M1440 980 l0 18 M1440 980 l12.7 12.7"/>
</g>
<g fill="#64748b">
  <circle cx="120" cy="180" r="4"/><circle cx="480" cy="150" r="4"/><circle cx="860" cy="190" r="4"/>
  <circle cx="920" cy="700" r="4"/><circle cx="620" cy="780" r="4"/><circle cx="1140" cy="1040" r="4"/>
  <circle cx="780" cy="1380" r="4"/><circle cx="1440" cy="980" r="4"/>
</g>

<!-- parcel numbers -->
<g font-family="ui-monospace, monospace" font-size="26" fill="#7d93b2" text-anchor="middle" opacity="0.85">
  <text x="360" y="390">๒๑๔</text>
  <text x="730" y="540">๒๑๕</text>
  <text x="390" y="800">๒๑๖</text>
  <text x="1060" y="500">๓๐๑</text>
  <text x="1330" y="540">๓๐๒</text>
  <text x="880" y="930">๓๐๓</text>
  <text x="520" y="1230">๔๑๐</text>
  <text x="960" y="1260">๔๑๑</text>
  <text x="1330" y="880">๔๑๒</text>
</g>

<!-- north arrow + scale bar -->
<g transform="translate(1500 120)" stroke="#64748b" fill="none" stroke-width="2.5">
  <path d="M0 60 L0 -30 M-14 -8 L0 -30 L14 -8"/>
</g>
<text x="1500" y="200" font-family="ui-monospace, monospace" font-size="30" fill="#64748b" text-anchor="middle">N</text>
<g transform="translate(120 1500)">
  <rect x="0" y="0" width="120" height="8" fill="#64748b"/>
  <rect x="120" y="0" width="120" height="8" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="0" y="-10" font-family="ui-monospace, monospace" font-size="22" fill="#64748b">0</text>
  <text x="120" y="-10" font-family="ui-monospace, monospace" font-size="22" fill="#64748b" text-anchor="middle">100</text>
  <text x="240" y="-10" font-family="ui-monospace, monospace" font-size="22" fill="#64748b" text-anchor="end">200 m</text>
</g>

<!-- sun: minimal, geometric -->
<circle cx="1400" cy="120" r="46" fill="none" stroke="#e2b23a" stroke-width="3" opacity="0.5"/>
<circle cx="1400" cy="120" r="30" fill="#f6d574" opacity="0.35"/>
</svg>
