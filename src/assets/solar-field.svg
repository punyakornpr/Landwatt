    <circle cx="950" cy="810" r="8" fill="#f8fafc" stroke="none"/>
  </g>
  <!-- turbine 3 (right, smaller) -->
  <g stroke="#f8fafc" stroke-width="4" stroke-linecap="round" opacity="0.75">
    <path d="M1471,940 L1489,940 L1484,866 L1476,866 Z" fill="#f8fafc" stroke="none"/>
    <rect x="1480" y="855" width="17" height="10" rx="3" fill="#f8fafc" stroke="none"/>
    <g class="blade slower" style="transform-origin:1480px 862px">
      <line x1="1480" y1="862" x2="1480" y2="804"/>
      <line x1="1480" y1="862" x2="1530" y2="891"/>
      <line x1="1480" y1="862" x2="1430" y2="891"/>
    </g>
    <circle cx="1480" cy="862" r="6" fill="#f8fafc" stroke="none"/>
  </g>
</g>

