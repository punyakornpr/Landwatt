    <stop offset="0" stop-color="#b9d4f7"/>
    <stop offset="0.6" stop-color="#dceafb"/>
    <stop offset="1" stop-color="#f2f8ff"/>
  </linearGradient>
  <radialGradient id="wsun" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#fde68a" stop-opacity="0.95"/>
    <stop offset="0.5" stop-color="#fde68a" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="wridge1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#bcd9c8"/><stop offset="1" stop-color="#9ec9ae"/>
